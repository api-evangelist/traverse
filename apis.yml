name: Traverse
description: >-
  Traverse is a San Francisco data research lab, founded in 2025 by Lance Yan and
  backed by Y Combinator (W26) along with angel investors from OpenAI, Google
  DeepMind, Anthropic, and Meta. Traverse partners with frontier AI labs to solve
  "non-verifiable" work: the ambiguous, taste-dependent, long-horizon tasks in
  domains like law, healthcare, sales, and writing where reinforcement learning
  lacks the clean deterministic feedback loops it has in math and coding. The lab
  captures real human expert behavior in highly controlled settings and turns
  judgment, taste, and reasoning into high-fidelity training environments for
  frontier models. As of mid-2026 Traverse is an early-stage research lab with no
  public API, developer platform, SDKs, or product documentation — its public
  surface is a manifesto-style website, a blog, careers pages, and a contact CTA
  for prospective lab partners.
